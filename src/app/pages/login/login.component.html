<div class="login-container">
  <!-- 背景装饰元素 -->
  <div class="floating-element"></div>
  <div class="floating-element"></div>
  
  <div class="login-form">
    <!-- 系统标题 -->
    <div class="system-title">航班预订系统</div>
    <div class="system-subtitle">Flight Booking System</div>
    
    <!-- 登录标题 -->
    <div class="login-title">管理员登录</div>
    
    <form nz-form [formGroup]="loginForm" class="login-form">
      <!-- 用户名输入 -->
      <div class="form-input-container">
        <label class="form-label">用户名</label>
        <input nz-input formControlName="username" placeholder="请输入用户名">
      </div>
      
      <!-- 密码输入 -->
      <div class="form-input-container">
        <label class="form-label">密码</label>
        <input nz-input type="password" formControlName="password" placeholder="请输入密码">
      </div>
      
      <!-- 登录按钮 -->
      <button nz-button class="login-form-button" nzType="primary">登录</button>
      
      <!-- 底部链接 -->
      <div class="form-footer">
        <a class="forgot-link" href="#">忘记密码？</a>
      </div>
    </form>
  </div>
</div>
