<div class="login-container">
  <!-- 浮动装饰元素 -->
  <div class="floating-element"></div>
  <div class="floating-element"></div>
  <div class="floating-element"></div>
  <div class="floating-element"></div>
  
  <!-- 粒子效果 -->
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  
  <form nz-form [formGroup]="loginForm" class="login-form" (ngSubmit)="submitForm()">
    <h1 class="system-title">航空订单系统</h1>
    <p class="system-subtitle">高效 · 安全 · 专业</p>
    
    <h2 class="login-title">用户登录</h2>
    
    <nz-form-item>
      <nz-form-control nzErrorTip="请输入用户名!">
        <nz-input-group nzPrefixIcon="user">
          <input type="text" nz-input formControlName="username" placeholder="用户名 (admin)" />
        </nz-input-group>
      </nz-form-control>
    </nz-form-item>
    
    <nz-form-item>
      <nz-form-control nzErrorTip="请输入密码!">
        <nz-input-group nzPrefixIcon="lock">
          <input type="password" nz-input formControlName="password" placeholder="密码 (password)" />
        </nz-input-group>
      </nz-form-control>
    </nz-form-item>
    
    <button nz-button class="login-form-button" [nzType]="'primary'" [nzLoading]="isLoading" [disabled]="isLoading">
      {{ isLoading ? '登录中...' : '登 录' }}
    </button>
    
    <div class="form-footer">
      <a class="forgot-link" href="#">忘记密码？</a>
    </div>
  </form>
</div>
